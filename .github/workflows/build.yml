name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and generate documentation
        shell: bash
        run: ./gradlew build --no-daemon
      - name: Export sample atlas
        shell: bash
        run: ./gradlew :examples:run --args="samples/player.aseprite build/player-atlas.png" --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}
          path: |
            core/build/libs/*.jar
            gdx/build/libs/*.jar
            core/build/reports/tests/
            build/player-atlas.png
